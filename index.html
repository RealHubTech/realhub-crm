<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Realhub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ef;--surface:#fff;--s2:#f0ede8;--border:#e2ddd6;--border2:#c8c2ba;
  --text:#1a1714;--t2:#6b6560;--t3:#9e9892;
  --blue:#1e40af;--bl:#dbeafe;--green:#166534;--gl:#dcfce7;
  --red:#991b1b;--rl:#fee2e2;--amber:#92400e;--al:#fef3c7;
  --purple:#5b21b6;--pl:#ede9fe;
  --r:10px;--rs:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo-area{display:flex;align-items:center;gap:10px}
.app-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;display:none}
.app-logo.show{display:block}
.app-name{font-size:15px;font-weight:600;letter-spacing:-.3px}
.bar-actions{display:flex;gap:8px}
.main{max-width:1100px;margin:0 auto;padding:20px 16px}
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-p:hover{background:#1e3a8a}
.btn-g{background:#25D366;color:#fff;border-color:#25D366;font-weight:600}
.btn-g:hover{background:#128C7E}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-d{color:var(--red);border-color:#fca5a5}
.btn-d:hover{background:var(--rl)}
.btn-icon{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px}
.sv{font-size:24px;font-weight:600;font-family:'DM Mono',monospace}
.sl{font-size:11px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 11px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);outline:none;flex:1;min-width:130px}
.secim-bar{background:var(--bl);border:1px solid #93c5fd;border-radius:var(--r);padding:10px 16px;display:none;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.secim-bar.show{display:flex}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--s2);border-bottom:1px solid var(--border)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border:none}
tbody tr:hover{background:#fafaf8}
tbody tr.secili{background:#eff6ff}
td{padding:10px 14px;font-size:13px;vertical-align:middle}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-purple{background:var(--pl);color:var(--purple)}
.b-green{background:var(--gl);color:var(--green)}
.b-amber{background:var(--al);color:var(--amber)}
.b-gray{background:var(--s2);color:var(--t2)}
.b-blue{background:var(--bl);color:var(--blue)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);width:100%;max-width:560px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-lg{max-width:820px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.mt{font-size:15px;font-weight:600}
.mb{padding:20px;max-height:80vh;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--s2);border-radius:0 0 var(--r) var(--r)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--s2);color:var(--text);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff}
.field textarea{min-height:72px;resize:vertical}
.sec{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.post-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.post-canvas-wrap{background:#111;border-radius:var(--rs);overflow:hidden;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;position:relative}
canvas#postCanvas{display:block;width:100%;height:100%;object-fit:contain}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--rs);padding:16px;text-align:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.upload-zone:hover{border-color:var(--blue);background:var(--bl)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone p{font-size:12px;color:var(--t2);pointer-events:none}
.prev-img{width:100%;height:80px;object-fit:cover;border-radius:var(--rs);margin-top:8px;display:none}
.prev-img.show{display:block}
.msg-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{padding:3px 9px;border-radius:20px;background:var(--bl);color:var(--blue);font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);background:var(--s2);font-size:13px;color:var(--t2)}
.pbtns{display:flex;gap:4px}
.pbtn{width:30px;height:30px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center}
.pbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{text-align:center;padding:56px 24px;color:var(--t3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1714;color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadeup .2s ease}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.footer{text-align:center;padding:20px;margin-top:32px}
.powered{display:inline-flex;align-items:center;gap:8px;opacity:.45}
.rhn{font-size:13px;font-weight:700;color:var(--text)}
.rhn span{font-weight:300}
.rhs{font-size:9px;color:var(--t3)}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .sv{font-size:20px}
  .bar{padding:0 12px;height:auto;min-height:54px;flex-wrap:wrap;gap:6px;padding-top:8px;padding-bottom:8px}
  .bar-actions{gap:5px}
  .bar-actions .btn-sm{padding:5px 8px;font-size:11px}
  .app-name{font-size:14px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .toolbar input{grid-column:1/-1}
  .toolbar button{grid-column:1/-1}
  th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){display:none}
  td{padding:8px;font-size:12px}
  th{padding:8px;font-size:10px}
  .avatar{width:28px;height:28px;font-size:11px}
  .fg{grid-template-columns:1fr}.fc{grid-column:1}
  .post-grid{grid-template-columns:1fr}
  .pagination{flex-direction:column;gap:8px;text-align:center}
}
</style>
</head>
<body>
<div id="app" style="display:none">
<div class="bar">
  <div class="logo-area">
    <img class="app-logo" id="app-logo" src="" alt="">
    <span class="app-name" id="app-name">CRM Realhub</span>
  </div>
  <div class="bar-actions">
    <button class="btn btn-sm" onclick="acAyarlar()">Ayarlar</button>
    <button class="btn btn-sm btn-p" onclick="acYeni()">+ Musteri</button>
  </div>
</div>
<div class="main">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="search" id="ara" placeholder="Ara... isim, telefon, e-posta" oninput="render()">
    <select id="fkat" onchange="render()">
      <option value="">Tum kategoriler</option>
      <option>VIP</option><option>Yeni</option><option>Aktif</option><option>Yari Aktif</option><option>Pasif</option>
    </select>
    <select id="fsort" onchange="render()">
      <option value="yeni">En yeni</option>
      <option value="isim">Isme gore</option>
      <option value="son">Son ziyaret</option>
    </select>
    <button class="btn btn-sm" onclick="hepsiniSec()">Tumunu Sec</button>
  </div>
  <div class="secim-bar" id="secim-bar">
    <span id="secim-sayi" style="font-size:13px;font-weight:600;color:var(--blue)"></span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="secimTemizle()">Temizle</button>
      <button class="btn btn-sm" style="background:#0a84ff;color:#fff;border-color:#0a84ff" onclick="acSmsGonder()">SMS Gonder</button>
      <button class="btn btn-sm btn-g" onclick="acWpGonder()">WhatsApp Kampanyasi</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th style="width:36px"><input type="checkbox" id="mcb" onchange="masterCb(this)"></th>
        <th>Musteri</th><th>Telefon</th><th>E-posta</th><th>Kategori</th><th>Eklenme</th><th>Islem</th>
      </tr></thead>
      <tbody id="tablo"></tbody>
    </table>
    <div class="pagination" id="pag"></div>
  </div>
  <div class="footer"><div class="powered"><div><div class="rhn"><span>REAL</span>hub</div><div class="rhs">Realhub Tech Distribution Ltd.</div></div></div></div>
</div>
</div>
<div id="mroot"></div>
<script>
var SB_URL = 'https://clxirwqzgylajqduwrcd.supabase.co';
var SB_KEY = 'sb_publishable_7GaYkk8pxkaq7zedReOTBg_AUPs83BY';

function sbFetch(path, opts) {
  if (!opts) opts = {};
  var fetchOpts = {
    method: opts.method || 'GET',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation'
    }
  };
  if (opts.body) fetchOpts.body = opts.body;
  return fetch(SB_URL + '/rest/v1/' + path, fetchOpts).then(function(res) {
    if (!res.ok) return res.text().then(function(err) { throw new Error(err); });
    return res.text().then(function(txt) { return txt ? JSON.parse(txt) : null; });
  });
}

var oturum = null;

function oturumAc(firma) { oturum = firma; localStorage.setItem('crm_oturum', JSON.stringify(firma)); }
function oturumKapat() { oturum = null; localStorage.removeItem('crm_oturum'); girisEkraniGoster(); }
function oturumYukle() { try { oturum = JSON.parse(localStorage.getItem('crm_oturum') || 'null'); } catch(e) { oturum = null; } }

function load() {
  return sbFetch('musteriler?firma_id=eq.' + oturum.firma_id + '&order=id.desc').then(function(d) { return d || []; }).catch(function() { return []; });
}
function loadAy() {
  return sbFetch('ayarlar?firma_id=eq.' + oturum.firma_id + '&limit=1').then(function(d) { return (d && d[0]) || {}; }).catch(function() { return {}; });
}
function saveAy(ay) {
  return sbFetch('ayarlar?firma_id=eq.' + oturum.firma_id + '&limit=1').then(function(mevcut) {
    var data = {};
    var keys = Object.keys(ay);
    for (var i = 0; i < keys.length; i++) data[keys[i]] = ay[keys[i]];
    data.firma_id = oturum.firma_id;
    if (mevcut && mevcut.length) {
      data.updated_at = new Date().toISOString();
      return sbFetch('ayarlar?firma_id=eq.' + oturum.firma_id, {method:'PATCH', body:JSON.stringify(data), prefer:'return=minimal'});
    } else {
      return sbFetch('ayarlar', {method:'POST', body:JSON.stringify(data), prefer:'return=minimal'});
    }
  });
}

oturumYukle();
if (oturum) { uygulamaBaslat(); } else { girisEkraniGoster(); }

function girisEkraniGoster() {
  document.getElementById('app').style.display = 'none';
  var el = document.getElementById('giris-ekrani');
  if (!el) { el = document.createElement('div'); el.id = 'giris-ekrani'; document.body.appendChild(el); }
  el.style.display = 'flex';
  el.innerHTML = '<div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e40af 0%,#7c3aed 100%);font-family:DM Sans,sans-serif"><div style="background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)"><div style="text-align:center;margin-bottom:28px"><div style="font-size:22px;font-weight:700;color:#1a1714">CRM Realhub</div><div style="font-size:13px;color:#9e9892;margin-top:4px">Hesabiniza giris yapin</div></div><div style="margin-bottom:14px"><label style="display:block;font-size:12px;font-weight:600;color:#6b6560;margin-bottom:5px;text-transform:uppercase">Sifre</label><input id="giris-sifre" type="password" placeholder="..." style="width:100%;padding:11px 14px;border:1.5px solid #e2ddd6;border-radius:8px;font-size:15px;font-family:DM Sans,sans-serif;outline:none" onfocus="this.style.borderColor=\'#1e40af\'" onblur="this.style.borderColor=\'#e2ddd6\'" onkeydown="if(event.key===\'Enter\')girisYap()"></div><button onclick="girisYap()" id="giris-btn" style="width:100%;padding:12px;background:linear-gradient(135deg,#1e40af,#7c3aed);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif">Giris Yap</button><div id="giris-hata" style="color:#991b1b;font-size:13px;text-align:center;margin-top:10px;display:none"></div><div style="text-align:center;margin-top:16px;font-size:11px;color:#c8c2ba">Realhub Tech Distribution Ltd.</div></div></div>';
  setTimeout(function() { var el = document.getElementById('giris-sifre'); if (el) el.focus(); }, 100);
}

function girisYap() {
  var sifre = (document.getElementById('giris-sifre').value || '').trim();
  if (!sifre) return;
  var btn = document.getElementById('giris-btn');
  btn.textContent = 'Kontrol ediliyor...'; btn.disabled = true;
  sbFetch('firmalar?sifre=eq.' + encodeURIComponent(sifre) + '&aktif=eq.true&limit=1').then(function(data) {
    if (data && data.length) {
      var firma = data[0];
      oturumAc({firma_id: firma.id, firma_adi: firma.firma_adi});
      document.getElementById('giris-ekrani').style.display = 'none';
      uygulamaBaslat();
    } else {
      var hata = document.getElementById('giris-hata');
      hata.textContent = 'Hatali sifre veya hesap aktif degil.';
      hata.style.display = 'block';
      btn.textContent = 'Giris Yap'; btn.disabled = false;
    }
  }).catch(function() {
    var hata = document.getElementById('giris-hata');
    hata.textContent = 'Baglanti hatasi, tekrar deneyin.';
    hata.style.display = 'block';
    btn.textContent = 'Giris Yap'; btn.disabled = false;
  });
}

function uygulamaBaslat() {
  document.getElementById('app').style.display = 'block';
  var barActions = document.querySelector('.bar-actions');
  if (barActions && !document.getElementById('cikis-btn')) {
    var cikisBtn = document.createElement('button');
    cikisBtn.id = 'cikis-btn';
    cikisBtn.className = 'btn btn-sm';
    cikisBtn.textContent = 'Cikis';
    cikisBtn.onclick = function() { if (confirm('Cikis yapmak istediginizden emin misiniz?')) oturumKapat(); };
    barActions.appendChild(cikisBtn);
  }
  render();
}

var secili = [], sayfa = 1;
var PER = 20;

function seciliHas(id) { return secili.indexOf(id) >= 0; }
function seciliEkle(id) { if (!seciliHas(id)) secili.push(id); }
function seciliKaldir(id) { var i = secili.indexOf(id); if (i >= 0) secili.splice(i, 1); }

function esc(v) { return (v || ''); }
function bugun() { return new Date().toLocaleDateString('tr-TR'); }
function initials(a, s) { return ((a || ' ')[0] + (s || ' ')[0]).toUpperCase(); }
function toast(m, sure) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function() { t.remove(); }, 300); }, sure || 2500);
}

var KB = {'VIP':'b-purple','Yeni':'b-amber','Aktif':'b-green','Yari Aktif':'b-blue','Pasif':'b-gray'};

function otomatikKategori(m) {
  if (m.k === 'VIP') return 'VIP';
  if (!m.ziyaret) return m.k || '';
  var gun = Math.floor((Date.now() - new Date(m.ziyaret)) / (1000 * 60 * 60 * 24));
  if (gun <= 30) return 'Yeni';
  if (gun <= 90) return 'Aktif';
  if (gun <= 180) return 'Yari Aktif';
  return 'Pasif';
}

function renderStats() {
  return Promise.all([load(), loadAy()]).then(function(results) {
    var d = results[0], ay = results[1];
    var cats = d.map(function(m) { return otomatikKategori(m); });
    var vip = cats.filter(function(k) { return k === 'VIP'; }).length;
    var aktif = cats.filter(function(k) { return k === 'Aktif' || k === 'Yeni'; }).length;
    var pasif = cats.filter(function(k) { return k === 'Pasif' || k === 'Yari Aktif'; }).length;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="sv">' + d.length + '</div><div class="sl">Toplam Musteri</div></div>' +
      '<div class="stat"><div class="sv" style="color:var(--purple)">' + vip + '</div><div class="sl">VIP</div></div>' +
      '<div class="stat"><div class="sv" style="color:var(--green)">' + aktif + '</div><div class="sl">Aktif / Yeni</div></div>' +
      '<div class="stat"><div class="sv" style="color:var(--t3)">' + pasif + '</div><div class="sl">Pasif / Yari Aktif</div></div>';
    var logo = document.getElementById('app-logo');
    if (ay.logo) { logo.src = ay.logo; logo.classList.add('show'); } else { logo.classList.remove('show'); }
    var isim = ay.isim || (oturum && oturum.firma_adi) || 'CRM Realhub';
    document.getElementById('app-name').textContent = isim;
  });
}

function render() {
  renderStats();
  load().then(function(d) {
    var ara = (document.getElementById('ara').value || '').toLowerCase();
    var fk = document.getElementById('fkat').value;
    var fs = document.getElementById('fsort').value;
    if (ara) d = d.filter(function(m) { return ((m.ad||'') + ' ' + (m.soyad||'') + ' ' + (m.tel||'') + ' ' + (m.mail||'')).toLowerCase().indexOf(ara) >= 0; });
    if (fk) d = d.filter(function(m) { return otomatikKategori(m) === fk; });
    if (fs === 'isim') d.sort(function(a, b) { return (a.ad||'').localeCompare(b.ad||'', 'tr'); });
    else if (fs === 'son') d.sort(function(a, b) { return (b.ziyaret||'').localeCompare(a.ziyaret||''); });

    var top = d.length, bas = (sayfa - 1) * PER;
    var sd = d.slice(bas, bas + PER);
    var tb = document.getElementById('tablo');

    if (!d.length) {
      tb.innerHTML = '<tr><td colspan="7"><div class="empty"><div style="font-size:44px;margin-bottom:12px">&#128101;</div><div>Henuz musteri yok.</div></div></td></tr>';
      document.getElementById('pag').innerHTML = '';
      document.getElementById('secim-bar').classList.remove('show');
      return;
    }

    var html = '';
    for (var i = 0; i < sd.length; i++) {
      var m = sd[i];
      var gk = otomatikKategori(m);
      var isSecili = seciliHas(m.id);
      html += '<tr class="' + (isSecili ? 'secili' : '') + '" style="cursor:pointer">';
      html += '<td onclick="event.stopPropagation()"><input type="checkbox" ' + (isSecili ? 'checked' : '') + ' onchange="togSec(' + m.id + ',this.checked)"></td>';
      html += '<td onclick="acDetay(' + m.id + ')"><div style="display:flex;align-items:center;gap:10px"><div class="avatar">' + initials(m.ad, m.soyad) + '</div><div><div style="font-weight:500">' + (m.ad||'') + ' ' + (m.soyad||'') + '</div>' + (m['not'] ? '<div style="font-size:11px;color:var(--t2)">' + (m['not'].length > 45 ? m['not'].slice(0,45) + '...' : m['not']) + '</div>' : '') + '</div></div></td>';
      html += '<td onclick="acDetay(' + m.id + ')" style="font-family:\'DM Mono\',monospace">' + (m.tel || '-') + '</td>';
      html += '<td onclick="acDetay(' + m.id + ')" style="color:var(--t2)">' + (m.mail || '-') + '</td>';
      html += '<td onclick="acDetay(' + m.id + ')"><span class="badge ' + (KB[gk] || 'b-gray') + '">' + (gk || '-') + '</span></td>';
      html += '<td onclick="acDetay(' + m.id + ')" style="color:var(--t3);font-size:12px">' + (m.ziyaret ? new Date(m.ziyaret).toLocaleDateString('tr-TR') : m.eklenme || '') + '</td>';
      html += '<td><div style="display:flex;gap:4px"><button class="btn btn-sm" onclick="acDuzenle(' + m.id + ')">Duzenle</button><button class="btn btn-sm btn-d" onclick="mSil(' + m.id + ')">Sil</button></div></td>';
      html += '</tr>';
    }
    tb.innerHTML = html;

    var topSayfa = Math.ceil(top / PER);
    var pg = document.getElementById('pag');
    if (topSayfa <= 1) { pg.innerHTML = '<span>' + top + ' musteri</span><span></span>'; }
    else {
      var pb = '';
      var s = Math.max(1, sayfa - 2), e = Math.min(topSayfa, sayfa + 2);
      for (var j = s; j <= e; j++) pb += '<button class="pbtn ' + (sayfa === j ? 'on' : '') + '" onclick="spg(' + j + ')">' + j + '</button>';
      pg.innerHTML = '<span>' + (bas+1) + '-' + Math.min(bas+PER,top) + ' / ' + top + ' musteri</span><div class="pbtns">' + pb + '</div>';
    }

    var sb = document.getElementById('secim-bar');
    if (secili.length > 0) { sb.classList.add('show'); document.getElementById('secim-sayi').textContent = secili.length + ' musteri secildi'; }
    else { sb.classList.remove('show'); }
  });
}

function spg(n) { sayfa = n; render(); }

function togSec(id, c) {
  if (c) seciliEkle(id); else seciliKaldir(id);
  var sb = document.getElementById('secim-bar');
  var sayi = document.getElementById('secim-sayi');
  if (secili.length > 0) { sb.classList.add('show'); if (sayi) sayi.textContent = secili.length + ' musteri secildi'; }
  else { sb.classList.remove('show'); }
  var rows = document.querySelectorAll('#tablo tr');
  for (var i = 0; i < rows.length; i++) {
    var cb = rows[i].querySelector('input[type=checkbox]');
    if (cb) { if (cb.checked) rows[i].classList.add('secili'); else rows[i].classList.remove('secili'); }
  }
}

function secimTemizle() { secili = []; render(); }

function hepsiniSec() {
  load().then(function(d) {
    var ara = (document.getElementById('ara').value || '').toLowerCase();
    var fk = document.getElementById('fkat').value;
    if (ara) d = d.filter(function(m) { return ((m.ad||'') + ' ' + (m.soyad||'') + ' ' + (m.tel||'')).toLowerCase().indexOf(ara) >= 0; });

function hizliNotKaydet(id) {
  var yeniNot = (document.getElementById('hizli-not').value || '').trim();
  if (!yeniNot) { toast('Not bos olamaz'); return; }
  load().then(function(d) {
    var m = null;
    for (var i = 0; i < d.length; i++) { if (d[i].id === id) { m = d[i]; break; } }
    var eskiNot = m ? (m['not'] || '') : '';
    var birlesik = eskiNot ? eskiNot + '\n' + yeniNot : yeniNot;
    sbFetch('musteriler?id=eq.' + id + '&firma_id=eq.' + oturum.firma_id, {method:'PATCH', body:JSON.stringify({"not":birlesik}), prefer:'return=minimal'}).then(function() {
      closeModal(); render(); toast('Not kaydedildi');
    }).catch(function(e) { toast('Hata: ' + e.message); });
  });
}

function acDuzenle(id) {
  load().then(function(d) {
    var m = null;
    for (var i = 0; i < d.length; i++) { if (d[i].id === id) { m = d[i]; break; } }
    if (!m) return;
    showModal('<div class="modal"><div class="mh"><span class="mt">Musteri Duzenle</span><button class="btn btn-icon" onclick="closeModal()">x</button></div><div class="mb">' + formHTML(m) + '</div><div class="mf"><button class="btn" onclick="closeModal()">Iptal</button><button class="btn btn-p" onclick="mKaydet(\'' + id + '\')">Guncelle</button></div></div>');
  });

function mKaydet(id) {
  var yeni = {
    ad: document.getElementById('fad').value.trim(),
    soyad: document.getElementById('fsoy').value.trim(),
    tel: document.getElementById('ftel').value.trim(),
    mail: document.getElementById('fmail').value.trim(),
    k: document.getElementById('fkat2').value,
    ziyaret: document.getElementById('fziy').value || null,
    "not": document.getElementById('fnot').value,
    firma_id: oturum.firma_id
  };
  if (!yeni.ad && !yeni.tel) { alert('En az ad veya telefon giriniz.'); return; }
  var p;
  if (id) {
    p = sbFetch('musteriler?id=eq.' + id + '&firma_id=eq.' + oturum.firma_id, {method:'PATCH', body:JSON.stringify(yeni), prefer:'return=minimal'});
  } else {
    yeni.eklenme = bugun();
    p = sbFetch('musteriler', {method:'POST', body:JSON.stringify(yeni), prefer:'return=minimal'});
  }
  p.then(function() { closeModal(); render(); toast('Kaydedildi'); }).catch(function(e) { alert('Kayit hatasi: ' + e.message); });
}

function mSil(id) {
  if (!confirm('Bu musteri silinsin mi?')) return;
  sbFetch('musteriler?id=eq.' + id + '&firma_id=eq.' + oturum.firma_id, {method:'DELETE', prefer:'return=minimal'}).then(function() {
    seciliKaldir(id); render();
  }).catch(function(e) { alert('Silme hatasi: ' + e.message); });
}

function smsGonder() {
  load().then(function(data) {
    var list = data.filter(function(m) { return seciliHas(m.id) && m.tel; });
    var sablon = (document.getElementById('sms-msg') || {}).value || '';
    if (!list.length) { toast('Telefon numarasi olan musteri bulunamadi'); return; }
    if (!sablon.trim()) { toast('Mesaj bos olamaz'); return; }
    closeModal();
    var i = 0;
    var banner = document.createElement('div');
    banner.className = 'wp-banner';
    banner.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:#111;color:#fff;padding:16px 18px;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.6);font-family:DM Sans,sans-serif;font-size:13px;min-width:280px;border:1px solid #333';
    banner.innerHTML = '<div style="font-weight:700;font-size:14px;margin-bottom:4px">SMS Gonderim</div><div id="sms-sayac" style="color:#aaa;font-size:12px;margin-bottom:10px">Baslatiliyor...</div><div style="display:flex;gap:8px"><button id="sms-ileri" style="flex:1;background:#0a84ff;color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer">Sonraki</button><button onclick="this.closest(\'.wp-banner\').remove()" style="background:#333;color:#ccc;border:none;border-radius:8px;padding:9px 12px;cursor:pointer">X</button></div>';
    document.body.appendChild(banner);
    function gonder() {
      if (i >= list.length) { document.getElementById('sms-sayac').textContent = list.length + ' kisiye tamamlandi'; document.getElementById('sms-ileri').style.display = 'none'; return; }
      var m = list[i];
      var tel = m.tel.replace(/\D/g, '');
      var km = sablon.replace(/\[Isim\]/g, m.ad || '').replace(/\[Soyad\]/g, m.soyad || '');
      document.getElementById('sms-sayac').textContent = (i+1) + '/' + list.length + ' - ' + (m.ad || m.tel);
      window.open('sms:' + tel + '?body=' + encodeURIComponent(km), '_blank');
      i++;
    }
    document.getElementById('sms-ileri').onclick = gonder;
    gonder();
  });
}

function gorselListesiGuncelle() {
  var listEl = document.getElementById('gorsel-liste');

function initCanvasDrag() {
  var canvas = document.getElementById('postCanvas');
  if (!canvas || canvas._dragInited) return;
  canvas._dragInited = true;
  canvas.style.cursor = 'grab';
  var activeObj = null;
  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var sx = canvas.width / rect.width, sy = canvas.height / rect.height;
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {x:(cx-rect.left)*sx, y:(cy-rect.top)*sy};
  }
  function pickObj(pos) {
    if (pLogo && pos.y < 240) return logoState;
    for (var i = 0; i < postGorseller.length; i++) {
      var iy = 280 + i * 440;
      if (pos.y >= iy && pos.y < iy + 420) return postGorseller[i].state;
    }
    return null;
  }
  function onDown(e) { e.preventDefault(); var pos = getPos(e); var obj = pickObj(pos); if (!obj) return; activeObj = obj; obj.dragging = true; obj.lastX = pos.x; obj.lastY = pos.y; canvas.style.cursor = 'grabbing'; }
  function onMove(e) { e.preventDefault(); if (!activeObj || !activeObj.dragging) return; var pos = getPos(e); activeObj.x += pos.x - activeObj.lastX; activeObj.y += pos.y - activeObj.lastY; activeObj.lastX = pos.x; activeObj.lastY = pos.y; postCiz(); }
  function onUp() { if (activeObj) activeObj.dragging = false; activeObj = null; canvas.style.cursor = 'grab'; }
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);
}

function wrapText(ctx, text, maxW, size, font) {
  ctx.font = '500 ' + size + 'px ' + font;
  if (!text) return [];
  var words = text.split(' '), lines = [], cur = '';
  words.forEach(function(w) {
    var t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else { cur = t; }
  });
  if (cur) lines.push(cur);
  return lines.slice(0, 7);
}

function postCiz() {
  var canvas = document.getElementById('postCanvas'); if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = 1080;
  canvas.width = W;
  if (!postCiz._cache) postCiz._cache = {};
  var cache = postCiz._cache;
  var ay = {};
  try { ay = JSON.parse(localStorage.getItem('crm_ay_' + (oturum ? oturum.firma_id : '')) || '{}'); } catch(e) {}
  var baslik = (document.getElementById('wp-baslik') || {}).value || '';
  var body = (document.getElementById('wp-body') || {}).value || '';
  var baslikSz = +((document.getElementById('baslik-size') || {}).value || 56);
  var bodySz = +((document.getElementById('body-size') || {}).value || 36);
  var c1 = (document.getElementById('bg-c1') || {}).value || '#1e40af';
  var c2 = (document.getElementById('bg-c2') || {}).value || '#7c3aed';
  var bgSolid = (document.getElementById('bg-solid') || {}).value || postBgRenk;
  var baslikRenk = (document.getElementById('text-baslik-renk') || {}).value || '#ffffff';
  var bodyRenk = (document.getElementById('text-body-renk') || {}).value || '#ffffff';
  var toLoad = {};
  if (pLogo) toLoad._logo = pLogo;
  postGorseller.forEach(function(g, i) { toLoad['g' + i] = g.src; });
  var keys = Object.keys(toLoad);
  if (!keys.length) { drawAll({}); return; }
  var loaded = {}, done = 0;
  keys.forEach(function(k) {
    var src = toLoad[k];
    if (cache[src] && cache[src].complete && cache[src].naturalWidth) { loaded[k] = cache[src]; done++; if (done === keys.length) drawAll(loaded); return; }
    var im = new Image();
    im.onload = function() { cache[src] = im; loaded[k] = im; done++; if (done === keys.length) drawAll(loaded); };
    im.onerror = function() { done++; if (done === keys.length) drawAll(loaded); };
    im.src = src;
  });

  function drawAll(imgs) {
    var PAD = 40, GAP = 20;
    var bW = W - PAD * 2;
    var imgHeights = postGorseller.map(function(g, i) {
      var im = imgs['g' + i];
      if (!im || !im.naturalWidth) return 400;
      return Math.round(im.naturalHeight * (bW / im.naturalWidth));
    });
    var LOGO_PAD = 20, logoH = 0, logoW = 0, logoY = LOGO_PAD;
    if (imgs._logo) {
      var lim = imgs._logo;
      var maxW = Math.min(600, bW), maxH = 200;
      var ratio = Math.min(maxW / lim.naturalWidth, maxH / lim.naturalHeight);
      logoW = lim.naturalWidth * ratio; logoH = lim.naturalHeight * ratio;
    }
    var baslikSatir = baslik ? Math.ceil(baslik.length / 20) + 1 : 0;
    var bodySatir = body ? Math.ceil(body.length / 25) + 1 : 0;
    var textH = baslikSatir * (baslikSz * 1.4) + bodySatir * (bodySz * 1.6) + 60;
    var logoAreaH = pLogo ? (logoH + LOGO_PAD * 2 + 20) : 0;
    var imgsAreaH = 0; for (var ii = 0; ii < imgHeights.length; ii++) imgsAreaH += imgHeights[ii] + GAP;
    var H = Math.max(800, logoAreaH + imgsAreaH + textH + 80);
    canvas.height = H;
    if (postBgTip === 'solid') { ctx.fillStyle = bgSolid; ctx.fillRect(0, 0, W, H); }
    else { var g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
    var curY = LOGO_PAD;
    if (imgs._logo) {
      var pad = 16;
      var scaledW = logoW * logoState.scale, scaledH = logoH * logoState.scale;
      var drawX = W / 2 - scaledW / 2 + logoState.x, drawY = logoY + logoState.y;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.2)'; ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      if (ctx.roundRect) ctx.roundRect(drawX - pad, drawY - pad, scaledW + pad * 2, scaledH + pad * 2, 14);
      else ctx.rect(drawX - pad, drawY - pad, scaledW + pad * 2, scaledH + pad * 2);
      ctx.fill(); ctx.restore();
      ctx.drawImage(imgs._logo, drawX, drawY, scaledW, scaledH);
      curY = logoY + logoH + LOGO_PAD * 2 + 20;
    }
    for (var i = 0; i < postGorseller.length; i++) {
      var im = imgs['g' + i]; if (!im) continue;
      var st = postGorseller[i].state, ih = imgHeights[i];
      var srcW = im.naturalWidth || im.width || bW, srcH = im.naturalHeight || im.height || ih;
      var autoScale = Math.max(bW / srcW, ih / srcH);
      var es = autoScale * st.scale;
      var sw = srcW * es, sh = srcH * es;
      var ix = PAD + (bW - sw) / 2 + st.x, iy = curY + (ih - sh) / 2;
      ctx.save(); roundClip(ctx, PAD, curY, bW, ih, 18);
      ctx.drawImage(im, ix, iy, sw, sh);
      ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(PAD, curY, bW, ih);
      ctx.restore();
      curY += ih + GAP;
    }
    curY += 36; ctx.textAlign = 'center';
    if (baslik) {
      ctx.save(); ctx.fillStyle = baslikRenk; ctx.font = '700 ' + baslikSz + 'px ' + postFont;
      ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8;
      wrapText(ctx, baslik, W - 80, baslikSz, postFont).forEach(function(l) { ctx.fillText(l, W / 2, curY); curY += baslikSz * 1.3; });
      ctx.restore(); curY += 10;
    }
    if (body) {
      ctx.save(); ctx.fillStyle = bodyRenk; ctx.font = '400 ' + bodySz + 'px ' + postFont;
      wrapText(ctx, body, W - 120, bodySz, postFont).forEach(function(l) { ctx.fillText(l, W / 2, curY); curY += bodySz * 1.5; });
      ctx.restore();
    }
    ctx.font = '500 26px ' + postFont; ctx.fillStyle = 'rgba(255,255,255,.4)';
    loadAy().then(function(ay2) { ctx.fillText(ay2.isim || 'Isletmeniz', W / 2, H - 36); });
    var btn = document.getElementById('indir-btn'); if (btn) btn.disabled = false;
  }
}

function roundClip(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); }
  else {
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }
  ctx.clip();
}

var _importRows = [], _importHeaders = [];

function vImportAc(inp) {
  var f = inp.files[0]; if (!f) return;
  inp.value = '';
  var ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'csv') {
    var r = new FileReader();
    r.onload = function(e) { csvParseveGoster(e.target.result); };
    r.readAsText(f, 'UTF-8');
  } else if (ext === 'xlsx' || ext === 'xls') {
    if (!window.XLSX) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = function() { xlsxOku(f); };
      document.head.appendChild(s);
    } else { xlsxOku(f); }
  } else { alert('Sadece .xlsx, .xls veya .csv kabul edilir.'); }
}

function xlsxOku(f) {
  var r = new FileReader();
  r.onload = function(e) {
    var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
    var ws = wb.Sheets[wb.SheetNames[0]];
    var json = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    if (!json.length) { alert('Dosya bos.'); return; }
    var headers = json[0].map(function(h) { return (h+'').trim(); });
    var rows = json.slice(1).filter(function(r) { return r.some(function(c) { return c !== ''; }); });
    importEslestirmeGoster(headers, rows);
  };
  r.readAsArrayBuffer(f);
}

function csvParseveGoster(text) {
  text = text.replace(/^\uFEFF/, '');
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (!lines.length) { alert('Dosya bos.'); return; }
  var headers = lines[0].split(',').map(function(c) { return c.trim().replace(/^"|"$/g, ''); });
  var rows = lines.slice(1).map(function(l) { return l.split(',').map(function(c) { return c.trim().replace(/^"|"$/g, ''); }); }).filter(function(r) { return r.some(function(c) { return c; }); });
  importEslestirmeGoster(headers, rows);
}

function importEslestirmeGoster(headers, rows) {
  _importHeaders = headers; _importRows = rows;
  var alanlar = ['ad','soyad','tel','mail','k','ziyaret','not'];
  var labeller = {ad:'Ad',soyad:'Soyad',tel:'Telefon',mail:'E-posta',k:'Kategori',ziyaret:'Son Ziyaret',not:'Notlar'};
  var opts = '<option value="">- Secin -</option>' + headers.map(function(h, i) { return '<option value="' + i + '">' + h + '</option>'; }).join('');
  var formlar = alanlar.map(function(a) { return '<div class="field" style="margin:0"><label>' + labeller[a] + '</label><select id="imp-' + a + '" style="font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--s2);color:var(--text);outline:none;width:100%">' + opts + '</select></div>'; }).join('');
  showModal('<div class="modal" style="max-width:580px"><div class="mh"><span class="mt">Sutun Eslestirme - ' + rows.length + ' satir</span><button class="btn btn-icon" onclick="closeModal()">x</button></div><div class="mb"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' + formlar + '</div></div><div class="mf"><button class="btn" onclick="closeModal()">Iptal</button><button class="btn btn-p" onclick="importBaslat()">' + rows.length + ' Musteriy Ice Aktar</button></div></div>');
}

function importBaslat() {
  var alanlar = ['ad','soyad','tel','mail','k','ziyaret','not'];
  var eslesme = {};
  alanlar.forEach(function(a) { var el = document.getElementById('imp-' + a); if (el && el.value !== '') eslesme[a] = parseInt(el.value); });
  if (!Object.keys(eslesme).length) { alert('En az bir sutun eslestirin.'); return; }
  var basarili = 0, hatali = 0, toplu = [];
  _importRows.forEach(function(row) {
    var m = {firma_id: oturum.firma_id, eklenme: bugun()};
    Object.keys(eslesme).forEach(function(alan) { var val = (row[eslesme[alan]] || '').toString().trim(); if (val) m[alan] = val; });
    if (!m.ad && !m.tel) { hatali++; return; }
    toplu.push(m);
  });
  var i = 0;
  function insertGrup() {
    if (i >= toplu.length) { closeModal(); render(); toast(basarili + ' musteri ice aktarildi' + (hatali ? ' (' + hatali + ' atlandi)' : '')); return; }
    var grup = toplu.slice(i, i + 50); i += 50;
    sbFetch('musteriler', {method:'POST', body:JSON.stringify(grup), prefer:'return=minimal'}).then(function() { basarili += grup.length; insertGrup(); }).catch(function() { hatali += grup.length; insertGrup(); });
  }
  insertGrup();
}

function showModal(h) { document.getElementById('mroot').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()">' + h + '</div>'; }
function closeModal() {
  document.getElementById('mroot').innerHTML = '';
  pLogo = null; postGorseller = []; logoState = yeniState(); postFont = 'DM Sans,Arial'; postBgTip = 'gradient';
  if (postCiz._cache) postCiz._cache = {};
}
</script>
</body>
