<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Realhub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ef;--surface:#fff;--s2:#f0ede8;--border:#e2ddd6;--border2:#c8c2ba;
  --text:#1a1714;--t2:#6b6560;--t3:#9e9892;
  --blue:#1e40af;--bl:#dbeafe;--green:#166534;--gl:#dcfce7;
  --red:#991b1b;--rl:#fee2e2;--amber:#92400e;--al:#fef3c7;
  --purple:#5b21b6;--pl:#ede9fe;
  --r:10px;--rs:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* TOPBAR */
.bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo-area{display:flex;align-items:center;gap:10px}
.app-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;display:none}
.app-logo.show{display:block}
.app-name{font-size:15px;font-weight:600;letter-spacing:-.3px}
.bar-actions{display:flex;gap:8px}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:20px 16px}

/* BUTTONS */
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-p:hover{background:#1e3a8a}
.btn-g{background:#25D366;color:#fff;border-color:#25D366;font-weight:600}
.btn-g:hover{background:#128C7E}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-d{color:var(--red);border-color:#fca5a5}
.btn-d:hover{background:var(--rl)}
.btn-icon{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px}
.sv{font-size:24px;font-weight:600;font-family:'DM Mono',monospace}
.sl{font-size:11px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 11px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);outline:none;flex:1;min-width:130px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--blue)}

/* SECIM BAR */
.secim-bar{background:var(--bl);border:1px solid #93c5fd;border-radius:var(--r);padding:10px 16px;display:none;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.secim-bar.show{display:flex}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--s2);border-bottom:1px solid var(--border)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border:none}
tbody tr:hover{background:#fafaf8}
tbody tr.secili{background:#eff6ff}
td{padding:10px 14px;font-size:13px;vertical-align:middle}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-purple{background:var(--pl);color:var(--purple)}
.b-green{background:var(--gl);color:var(--green)}
.b-amber{background:var(--al);color:var(--amber)}
.b-gray{background:var(--s2);color:var(--t2)}
.b-blue{background:var(--bl);color:var(--blue)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);width:100%;max-width:560px;box-shadow:0 8px 32px rgba(0,0,0,.15);margin-top:0}
.modal-lg{max-width:820px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.mt{font-size:15px;font-weight:600}
.mb{padding:20px;max-height:80vh;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--s2);border-radius:0 0 var(--r) var(--r)}

/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--s2);color:var(--text);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff}
.field textarea{min-height:72px;resize:vertical}
.sec{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}

/* POST DESIGNER */
.post-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.post-canvas-wrap{background:#111;border-radius:var(--rs);overflow:hidden;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;position:relative}
canvas#postCanvas{display:block;width:100%;height:100%;object-fit:contain}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--rs);padding:16px;text-align:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.upload-zone:hover{border-color:var(--blue);background:var(--bl)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone p{font-size:12px;color:var(--t2);pointer-events:none}
.prev-img{width:100%;height:80px;object-fit:cover;border-radius:var(--rs);margin-top:8px;display:none}
.prev-img.show{display:block}
.msg-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{padding:3px 9px;border-radius:20px;background:var(--bl);color:var(--blue);font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:background .15s}
.tag:hover{background:#bfdbfe}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);background:var(--s2);font-size:13px;color:var(--t2)}
.pbtns{display:flex;gap:4px}
.pbtn{width:30px;height:30px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pbtn:hover:not(.on){background:var(--s2)}

/* EMPTY */
.empty{text-align:center;padding:56px 24px;color:var(--t3)}
.empty-icon{font-size:44px;margin-bottom:12px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1714;color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadeup .2s ease}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* FOOTER */
.footer{text-align:center;padding:20px;margin-top:32px}
.powered{display:inline-flex;align-items:center;gap:8px;opacity:.45;transition:opacity .2s}
.powered:hover{opacity:1}
.rhn{font-size:13px;font-weight:700;color:var(--text)}
.rhn span{font-weight:300}
.rhs{font-size:9px;color:var(--t3)}

@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .sv{font-size:20px}
  .bar{padding:0 12px;height:auto;min-height:54px;flex-wrap:wrap;gap:6px;padding-top:8px;padding-bottom:8px}
  .bar-actions{gap:5px}
  .bar-actions .btn-sm{padding:5px 8px;font-size:11px}
  .app-name{font-size:14px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .toolbar input{grid-column:1/-1}
  .toolbar button{grid-column:1/-1}
  th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){display:none}
  td{padding:8px;font-size:12px}
  th{padding:8px;font-size:10px}
  .avatar{width:28px;height:28px;font-size:11px}
  .fg{grid-template-columns:1fr}.fc{grid-column:1}
  .post-grid{grid-template-columns:1fr}
  .pagination{flex-direction:column;gap:8px;text-align:center}
}
</style>
</head>
<body>

  <div class="table-wrap">

  <div class="footer">

      <svg width="22" height="22" viewBox="0 0 80 80" fill="none">

        <rect x="30" y="34" width="20" height="20" rx="4" fill="url(#g2)"/>
        <defs>
          <linearGradient id="g1" x1="8" y1="8" x2="72" y2="72" gradientUnits="userSpaceOnUse"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
          <linearGradient id="g2" x1="30" y1="34" x2="50" y2="54" gradientUnits="userSpaceOnUse"><stop stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
        </defs>
      </svg>
      <div><div class="rhn"><span>REAL</span>hub</div><div class="rhs">Realhub Tech Distribution Ltd.</div></div>
    </div>
  </div>

</div><!-- /app -->

<script>
//  SUPABASE CONFIG 
const SB_URL = 'https://clxirwqzgylajqduwrcd.supabase.co';
const SB_KEY = 'sb_publishable_7GaYkk8pxkaq7zedReOTBg_AUPs83BY';

async function sbFetch(path, opts={}){
  const fetchOpts = {
    method: opts.method||'GET',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer||'return=representation'
    }
  };
  if(opts.body) fetchOpts.body = opts.body;
  const res = await fetch(SB_URL+'/rest/v1/'+path, fetchOpts);
  if(!res.ok){ const err=await res.text(); throw new Error(err); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

//  SESSION 
let oturum = null; // {firma_id, firma_adi}

function oturumAc(firma){ oturum=firma; localStorage.setItem('crm_oturum', JSON.stringify(firma)); }
function oturumKapat(){ oturum=null; localStorage.removeItem('crm_oturum'); girisEkraniGoster(); }
function oturumYukle(){ try{ oturum=JSON.parse(localStorage.getItem('crm_oturum')||'null'); }catch{ oturum=null; } }

//  LOCAL CACHE (hz iin) 
let _musteriler = [], _ayarlar = {};

async function load(){
  const data = await sbFetch(`musteriler?firma_id=eq.${oturum.firma_id}&order=id.desc`);
  _musteriler = data||[];
  return _musteriler;
}
async function loadAy(){
  const data = await sbFetch(`ayarlar?firma_id=eq.${oturum.firma_id}&limit=1`);
  _ayarlar = (data&&data[0]) || {};
  return _ayarlar;
}

async function musterileriKaydet(liste){
  // Kullanlmyor  her ilem tek kayt zerinden
}

//  INIT 
oturumYukle();
if(oturum){ uygulamaBaslat(); } else { girisEkraniGoster(); }

//  GR EKRANI 
function girisEkraniGoster(){
  document.getElementById('app').style.display='none';
  let el = document.getElementById('giris-ekrani');
  if(!el){ el=document.createElement('div'); el.id='giris-ekrani'; document.body.appendChild(el); }
  el.style.display='flex';
  el.innerHTML=`
    <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e40af 0%,#7c3aed 100%);font-family:'DM Sans',sans-serif">
      <div style="background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
        <div style="text-align:center;margin-bottom:28px">
          <div style="width:56px;height:56px;background:linear-gradient(135deg,#1e40af,#7c3aed);border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center">
            <svg width="28" height="28" viewBox="0 0 80 80" fill="none"><path d="M40 8L8 32v40h20V48h24v24h20V32L40 8z" fill="#fff"/></svg>
          </div>
          <div style="font-size:22px;font-weight:700;color:#1a1714">CRM Realhub</div>
          <div style="font-size:13px;color:#9e9892;margin-top:4px">Hesab\u0131n\u0131za giri\u015f yap\u0131n</div>
        </div>
        <div style="margin-bottom:14px">
          <label style="display:block;font-size:12px;font-weight:600;color:#6b6560;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px">\u015eifre</label>
          <input id="giris-sifre" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022"
            style="width:100%;padding:11px 14px;border:1.5px solid #e2ddd6;border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border .15s"
            onfocus="this.style.borderColor='#1e40af'" onblur="this.style.borderColor='#e2ddd6'"
            onkeydown="if(event.key==='Enter')girisYap()">
        </div>
        <button onclick="girisYap()" id="giris-btn"
          style="width:100%;padding:12px;background:linear-gradient(135deg,#1e40af,#7c3aed);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s">
          Giri\u015f Yap
        </button>
        <div id="giris-hata" style="color:#991b1b;font-size:13px;text-align:center;margin-top:10px;display:none"></div>
        <div style="text-align:center;margin-top:16px;font-size:11px;color:#c8c2ba">Realhub Tech Distribution Ltd.</div>
      </div>
    </div>`;
  setTimeout(()=>{const el=document.getElementById('giris-sifre');if(el)el.focus();},100);
}

async function girisYap(){
  const sifre = (document.getElementById('giris-sifre').value||'').trim();
  if(!sifre) return;
  const btn = document.getElementById('giris-btn');
  btn.textContent='Kontrol ediliyor\u2026'; btn.disabled=true;

  try{
    const data = await sbFetch(`firmalar?sifre=eq.${encodeURIComponent(sifre)}&aktif=eq.true&limit=1`);
    if(data && data.length){
      const firma = data[0];
      oturumAc({firma_id: firma.id, firma_adi: firma.firma_adi});
      document.getElementById('giris-ekrani').style.display='none';
      uygulamaBaslat();
    } else {
      const hata = document.getElementById('giris-hata');
      hata.textContent='Hatal\u0131 \u015fifre veya hesap aktif de\u011fil.';
      hata.style.display='block';
      btn.textContent='Giri\u015f Yap'; btn.disabled=false;
    }
  } catch(e){
    const hata = document.getElementById('giris-hata');
    hata.textContent='Ba\u011flant\u0131 hatas\u0131, tekrar deneyin.';
    hata.style.display='block';
    btn.textContent='Giri\u015f Yap'; btn.disabled=false;
  }
}

//  UYGULAMA BALAT 
async function uygulamaBaslat(){
  document.getElementById('app').style.display='block';
  // Topbar'a firma ad ve k butonu ekle
  const barActions = document.querySelector('.bar-actions');
  if(barActions && !document.getElementById('cikis-btn')){
    const cikisBtn = document.createElement('button');
    cikisBtn.id='cikis-btn';
    cikisBtn.className='btn btn-sm';
    cikisBtn.textContent='\u00c7\u0131k\u0131\u015f';
    cikisBtn.onclick=()=>{ if(confirm('\u00c7\u0131k\u0131\u015f yapmak istedi\u011finizden emin misiniz?')) oturumKapat(); };
    barActions.appendChild(cikisBtn);
  }
  await render();
}

//  STORAGE (Supabase) 
async function load(){
  try{
    const data = await sbFetch(`musteriler?firma_id=eq.${oturum.firma_id}&order=id.desc`);
    return data||[];
  } catch{ return []; }
}

async function loadAy(){
  try{
    const data = await sbFetch(`ayarlar?firma_id=eq.${oturum.firma_id}&limit=1`);
    return (data&&data[0]) || {};
  } catch{ return {}; }
}

async function saveAy(ay){
  const mevcut = await sbFetch(`ayarlar?firma_id=eq.${oturum.firma_id}&limit=1`);
  if(mevcut&&mevcut.length){
    await sbFetch(`ayarlar?firma_id=eq.${oturum.firma_id}`, {method:'PATCH', body:JSON.stringify(Object.assign({}, ay, {firma_id:oturum.firma_id, updated_at:new Date().toISOString()})), prefer:'return=minimal'});
  } else {
    await sbFetch('ayarlar', {method:'POST', body:JSON.stringify(Object.assign({}, ay, {firma_id:oturum.firma_id})), prefer:'return=minimal'});
  }
}

//  STATE 
let secili=new Set(), sayfa=1;
const PER=20;

function esc(v){return(v||'')}
function bugun(){return new Date().toLocaleDateString('tr-TR')}
function initials(a,s){return((a||' ')[0]+(s||' ')[0]).toUpperCase()}
function toast(m,sure){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},sure||2500)}

//  STATS 
async function renderStats(){
  const d=await load(), ay=await loadAy();
  const cats=d.map(m=>otomatikKategori(m));
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="sv">${d.length}</div><div class="sl">Toplam M\u00fc\u015fteri</div></div>
    <div class="stat"><div class="sv" style="color:var(--purple)">${cats.filter(k=>k==='VIP').length}</div><div class="sl">VIP</div></div>
    <div class="stat"><div class="sv" style="color:var(--green)">${cats.filter(k=>k==='Aktif'||k==='Yeni').length}</div><div class="sl">Aktif / Yeni</div></div>

//  RENDER 
async function render(){
  await renderStats();
  let d=await load();
  const ara=(document.getElementById('ara').value||'').toLowerCase();
  const fk=document.getElementById('fkat').value;
  const fs=document.getElementById('fsort').value;
  if(ara) d=d.filter(m=>((m.ad||'')+' '+(m.soyad||'')+' '+(m.tel||'')+' '+(m.mail||'')).toLowerCase().includes(ara));
  if(fk) d=d.filter(m=>otomatikKategori(m)===fk);
  if(fs==='isim') d.sort((a,b)=>(a.ad||'').localeCompare(b.ad||'','tr'));
  else if(fs==='son') d.sort((a,b)=>(b.ziyaret||'').localeCompare(a.ziyaret||''));

  const top=d.length, bas=(sayfa-1)*PER;
  const sd=d.slice(bas,bas+PER);
  const tb=document.getElementById('tablo');

  if(!d.length){
    tb.innerHTML=`<tr><td colspan="7"><div class="empty"><div class="empty-icon">\u1f465</div><div>Hen\u00fcz m\u00fc\u015fteri yok. "+ M\u00fc\u015fteri" ile ekleyin.</div></div></td></tr>`;
    document.getElementById('pag').innerHTML='';
    document.getElementById('secim-bar').classList.remove('show');
    return;
  }

  tb.innerHTML=sd.map(m=>`
    <tr class="${secili.has(m.id)?'secili':''}" style="cursor:pointer">
      <td onclick="event.stopPropagation()"><input type="checkbox" ${secili.has(m.id)?'checked':''} onchange="togSec(${m.id},this.checked)"></td>
      <td onclick="acDetay(${m.id})"><div style="display:flex;align-items:center;gap:10px">
        <div class="avatar">${initials(m.ad,m.soyad)}</div>
        <div>
          <div style="font-weight:500">${m.ad||''} ${m.soyad||''}</div>
          ${m['not']?`<div style="font-size:11px;color:var(--t2);margin-top:1px">${m['not'].slice(0,45)}${m['not'].length>45?'\u2026':''}</div>`:''}
        </div>
      </div></td>
      <td onclick="acDetay(${m.id})" style="font-family:'DM Mono',monospace">${m.tel||'\u2014'}</td>
      <td onclick="acDetay(${m.id})" style="color:var(--t2)">${m.mail||'\u2014'}</td>
      <td onclick="acDetay(${m.id})">${(()=>{const gk=otomatikKategori(m);return `<span class="badge ${KB[gk]||'b-gray'}">${gk||'\u2014'}</span>${gk!==m.k&&m.k?`<span style="font-size:10px;color:var(--t3);margin-left:3px">(${m.k})</span>`:''}`})()} </td>
      <td onclick="acDetay(${m.id})" style="color:var(--t3);font-size:12px">${m.ziyaret?new Date(m.ziyaret).toLocaleDateString('tr-TR'):m.eklenme||''}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-sm" onclick="acDuzenle(${m.id})">D\u00fczenle</button>
        <button class="btn btn-sm btn-d" onclick="mSil(${m.id})">Sil</button>
      </div></td>
    </tr>`).join('');

  // Pagination
  const topSayfa=Math.ceil(top/PER);
  const pg=document.getElementById('pag');
  if(topSayfa<=1){pg.innerHTML=`<span>${top} m\u00fc\u015fteri</span><span></span>`;}
  else{
    let pb='';
    const s=Math.max(1,sayfa-2), e=Math.min(topSayfa,sayfa+2);
    if(s>1) pb+=`<button class="pbtn" onclick="spg(1)">1</button>${s>2?'<span style="padding:0 4px;color:var(--t3)">\u2026</span>':''}`;
    for(let i=s;i<=e;i++) pb+=`<button class="pbtn ${sayfa===i?'on':''}" onclick="spg(${i})">${i}</button>`;
    if(e<topSayfa) pb+=`${e<topSayfa-1?'<span style="padding:0 4px;color:var(--t3)">\u2026</span>':''}<button class="pbtn" onclick="spg(${topSayfa})">${topSayfa}</button>`;
    pg.innerHTML=`<span>${bas+1}\u2013${Math.min(bas+PER,top)} / ${top} m\u00fc\u015fteri</span><div class="pbtns">${pb}</div>`;
  }

  // Secim bar
  const sb=document.getElementById('secim-bar');
  if(secili.size>0){sb.classList.add('show');document.getElementById('secim-sayi').textContent=secili.size+' m\u00fc\u015fteri se\u00e7ildi';}
  else sb.classList.remove('show');
}

function spg(n){sayfa=n;render()}
function togSec(id,c){
  c?secili.add(id):secili.delete(id);
  const sb=document.getElementById('secim-bar');
  const sayi=document.getElementById('secim-sayi');
  if(secili.size>0){
    sb.classList.add('show');
    if(sayi) sayi.textContent=secili.size+' m\u00fc\u015fteri se\u00e7ildi';
  } else {
    sb.classList.remove('show');
  }
  document.querySelectorAll('#tablo tr').forEach(row=>{
    const cb=row.querySelector('input[type=checkbox]');
    if(cb){ cb.checked?row.classList.add('secili'):row.classList.remove('secili'); }
  });
}

async function hepsiniSec(){

  if(ara) d=d.filter(m=>((m.ad||'')+' '+(m.soyad||'')+' '+(m.tel||'')+' '+(m.mail||'')).toLowerCase().includes(ara));

// VIP: manuel, deimez. Dierleri son ziyarete gre otomatik.
function otomatikKategori(m){
  if(m.k==='VIP') return 'VIP'; // VIP hi\u00e7 de\u011fi\u015fmez
  if(!m.ziyaret) return m.k||''; // ziyaret yok, mevcut kategori kals\u0131n
  const gun=Math.floor((Date.now()-new Date(m.ziyaret))/(1000*60*60*24));
  if(gun<=30) return 'Yeni';
  if(gun<=90) return 'Aktif';
  if(gun<=180) return 'Yar\u0131 Aktif';
  return 'Pasif';
}

async function hizliNotKaydet(id){

  const m=d.find(x=>x.id===id);

  const birlesik=eskiNot?eskiNot+'\n'+yeniNot:yeniNot;
  try{
    await sbFetch(`musteriler?id=eq.${id}&firma_id=eq.${oturum.firma_id}`,{method:'PATCH',body:JSON.stringify({"not":birlesik}),prefer:'return=minimal'});

async function mKaydet(id){
  const yeni={
    ad:document.getElementById('fad').value.trim(),
    soyad:document.getElementById('fsoy').value.trim(),
    tel:document.getElementById('ftel').value.trim(),
    mail:document.getElementById('fmail').value.trim(),

    ziyaret:document.getElementById('fziy').value||null,
    "not":document.getElementById('fnot').value,
    firma_id: oturum.firma_id
  };
  if(!yeni.ad&&!yeni.tel){alert('En az ad veya telefon giriniz.');return}
  try{
    if(id){
      await sbFetch(`musteriler?id=eq.${id}&firma_id=eq.${oturum.firma_id}`, {method:'PATCH', body:JSON.stringify(yeni), prefer:'return=minimal'});
    } else {
      yeni.eklenme=bugun();
      await sbFetch('musteriler', {method:'POST', body:JSON.stringify(yeni), prefer:'return=minimal'});

    closeModal(); render(); toast('Kaydedildi \u2713');

async function mSil(id){

}

function smsSayac(ta){
  const n=ta.value.length;
  const adet=Math.ceil(n/160)||1;
  const karEl=document.getElementById('sms-karakter');
  const adetEl=document.getElementById('sms-adet');
  if(karEl) karEl.textContent=n;
  if(adetEl) adetEl.textContent=adet;
  if(karEl){
    karEl.style.color=n>160?'#991b1b':n>140?'#92400e':'var(--text)';
  }
}

function ekleTagSms(tag){
  const ta=document.getElementById('sms-msg');
  if(!ta)return;
  const pos=ta.selectionStart||ta.value.length;
  ta.value=ta.value.slice(0,pos)+tag+ta.value.slice(pos);
  ta.focus();ta.setSelectionRange(pos+tag.length,pos+tag.length);
  smsSayac(ta);
}

async function smsGonder(){
  const data=await load();
  const list=data.filter(m=>secili.has(m.id)&&m.tel);
  const ay=await loadAy();
  const sablon=(document.getElementById('sms-msg')||{}).value||'';
  if(!list.length){toast('Telefon numaras\u0131 olan m\u00fc\u015fteri bulunamad\u0131');return;}
  if(!sablon.trim()){toast('Mesaj bo\u015f olamaz');return;}

  closeModal();
  document.querySelectorAll('.wp-banner').forEach(b=>b.remove());

  let i=0;
  const toplam=list.length;

  const banner=document.createElement('div');
  banner.className='wp-banner';
  banner.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;background:#111;color:#fff;padding:16px 18px;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.6);font-family:DM Sans,sans-serif;font-size:13px;min-width:280px;border:1px solid #333';
  banner.innerHTML=`
    <div style="font-weight:700;font-size:14px;margin-bottom:4px">\u1f4f1 SMS G\u00f6nderim Paneli</div>
    <div id="sms-sayac" style="color:#aaa;font-size:12px;margin-bottom:10px;line-height:1.5">Ba\u015flat\u0131l\u0131yor\u2026</div>
    <div style="background:#1a1a1a;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11px;color:#888;line-height:1.5" id="sms-onizleme"></div>
    <div style="display:flex;gap:8px">
      <button id="sms-ileri" style="flex:1;background:#0a84ff;color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif">\u25b6 Sonraki Ki\u015fi</button>
      <button onclick="this.closest('.wp-banner').remove()" style="background:#333;color:#ccc;border:none;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:13px">\u2715</button>
    </div>`;
  document.body.appendChild(banner);

  function gonder(){
    if(i>=toplam){
      document.getElementById('sms-sayac').innerHTML=`<span style="color:#0a84ff">\u2713 ${toplam} ki\u015fiye SMS tamamland\u0131</span>`;
      document.getElementById('sms-ileri').style.display='none';
      return;
    }
    const m=list[i];
    const tel=m.tel.replace(/\D/g,'');
    const isimDeger=m.ad||m.soyad||ay.isim||'Say\u0131n M\u00fc\u015fterimiz';
    const km=sablon
      .replace(/\[\u0130sim\]/g,isimDeger)
      .replace(/\[Soyad\]/g,m.soyad||'')
      .replace(/\[\u0130\u015fletme\]/g,ay.isim||'');

    document.getElementById('sms-sayac').innerHTML=
      `<strong style="color:#fff">${i+1}/${toplam}</strong> \u2014 ${isimDeger}<br><span style="color:#666">${m.tel}</span>`;
    document.getElementById('sms-onizleme').textContent=km.slice(0,80)+(km.length>80?'\u2026':'');

    // SMS uygulamasn a  mesaj dolu gelir
    window.open(`sms:${tel}?body=${encodeURIComponent(km)}`,'_blank');
    i++;
  }

function syncBgPickers(){

function initCanvasDrag(){
  const canvas=document.getElementById('postCanvas');
  if(!canvas||canvas._dragInited)return;
  canvas._dragInited=true;
  canvas.style.cursor='grab';
  let activeObj=null; // {state} referans\u0131

  function getCanvasPos(e){
    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(cx-rect.left)*sx, y:(cy-rect.top)*sy};
  }

  function pickObj(pos){
    // Logo: st ~240px
    if(pLogo && pos.y<240) return logoState;
    // Grseller: eit dilimler arasnda blnr
    const W=canvas.width, LOGO_BOTTOM=240, PAD=40, GAP=16, IMG_H=420;
    for(let i=0;i<postGorseller.length;i++){
      const iy=LOGO_BOTTOM+PAD+(IMG_H+GAP)*i;
      if(pos.y>=iy && pos.y<iy+IMG_H) return postGorseller[i].state;
    }
    return null;
  }

  function onDown(e){
    e.preventDefault();
    const pos=getCanvasPos(e);
    const obj=pickObj(pos);
    if(!obj)return;
    activeObj=obj;
    obj.dragging=true; obj.lastX=pos.x; obj.lastY=pos.y;
    canvas.style.cursor='grabbing';
  }
  function onMove(e){
    e.preventDefault();
    if(!activeObj||!activeObj.dragging)return;
    const pos=getCanvasPos(e);
    activeObj.x+=pos.x-activeObj.lastX; activeObj.y+=pos.y-activeObj.lastY;
    activeObj.lastX=pos.x; activeObj.lastY=pos.y;
    postCiz();
  }
  function onUp(){if(activeObj)activeObj.dragging=false;activeObj=null;canvas.style.cursor='grab';}

  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('mouseleave',onUp);
  canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('touchend',onUp);
}

function logoYuklePost(inp){

    logoState=yeniState();

    if(prev){prev.src=e.target.result;prev.classList.add('show');}
    const ed=document.getElementById('logo-editor');

function ekleTag(tag){
  const ta=document.getElementById('wp-msg');if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+tag+ta.value.slice(e);
  ta.selectionStart=ta.selectionEnd=s+tag.length;ta.focus();postCiz();
}

function wrapText(ctx,text,maxW,size,font){
  font=font||"'DM Sans',Arial";
  ctx.font=`500 ${size}px ${font}`;
  if(!text) return [];
  const words=text.split(' ');const lines=[];let cur='';
  words.forEach(w=>{
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;
  });
  if(cur)lines.push(cur);
  return lines.slice(0,7);
}

function postCiz(){
  const canvas=document.getElementById('postCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=1080;
  canvas.width=W;

  const ay=loadAy();
  const baslik=(document.getElementById('wp-baslik')||{}).value||'';
  const body=(document.getElementById('wp-body')||{}).value||'';
  const baslikSz=+((document.getElementById('baslik-size')||{}).value||56);
  const bodySz=+((document.getElementById('body-size')||{}).value||36);
  const c1=(document.getElementById('bg-c1')||{}).value||ay.r1||'#1e40af';
  const c2=(document.getElementById('bg-c2')||{}).value||ay.r2||'#7c3aed';
  const bgSolid=(document.getElementById('bg-solid')||{}).value||postBgRenk;
  const baslikRenk=(document.getElementById('text-baslik-renk')||{}).value||'#ffffff';
  const bodyRenk=(document.getElementById('text-body-renk')||{}).value||'#ffffff';

  // Grsel cache
  if(!postCiz._cache) postCiz._cache={};
  const cache=postCiz._cache;

  const toLoad={};
  if(pLogo) toLoad._logo=pLogo;
  postGorseller.forEach((g,i)=>{ toLoad['g'+i]=g.src; });

  const keys=Object.keys(toLoad);
  if(!keys.length){ drawAll({}); return; }

  let loaded={}, done=0;
  keys.forEach(k=>{
    const src=toLoad[k];
    if(cache[src] && cache[src].complete && cache[src].naturalWidth){
      loaded[k]=cache[src]; done++;
      if(done===keys.length) drawAll(loaded);
      return;
    }
    const im=new Image();
    im.onload=()=>{ cache[src]=im; loaded[k]=im; done++; if(done===keys.length) drawAll(loaded); };
    im.onerror=()=>{ done++; if(done===keys.length) drawAll(loaded); };
    im.src=src;
  });

  function drawAll(imgs){
    const PAD=40, GAP=20;

    //  Her grselin gerek yksekliini hesapla (orijinal oran korunur) 
    // Grsel tam genilikte (W-2*PAD), ykseklik orijinal orana gre
    const bW=W-PAD*2;
    const imgHeights=postGorseller.map((g,i)=>{
      const im=imgs['g'+i];
      if(!im||!im.naturalWidth) return 400; // fallback
      return Math.round(im.naturalHeight * (bW/im.naturalWidth));
    });

    // Logo ykseklii
    const LOGO_PAD=20;
    let logoH=0, logoW=0, logoX=0, logoY=LOGO_PAD;
    if(imgs._logo){
      const im=imgs._logo;
      const maxW=Math.min(600, bW), maxH=200;
      const ratio=Math.min(maxW/im.naturalWidth, maxH/im.naturalHeight);
      logoW=im.naturalWidth*ratio; logoH=im.naturalHeight*ratio;
      logoX=W/2-logoW/2;
    }

    // Yaz ykseklii tahmini
    const baslikSatir=baslik?Math.ceil(baslik.length/20)+1:0;
    const bodySatir=body?Math.ceil(body.length/25)+1:0;
    const textH=baslikSatir*(baslikSz*1.4)+bodySatir*(bodySz*1.6)+60;

    // Canvas toplam ykseklii
    const logoAreaH=pLogo?(logoH+LOGO_PAD*2+20):0;
    const imgsAreaH=imgHeights.reduce((s,h)=>s+h+GAP,0);
    const H=Math.max(800, logoAreaH+imgsAreaH+textH+80);
    canvas.height=H;

    //  ARKA PLAN 
    if(postBgTip==='solid'){
      ctx.fillStyle=bgSolid; ctx.fillRect(0,0,W,H);
    } else {
      const g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,c1); g.addColorStop(1,c2);
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    // Dekoratif daireler kaldrld  homojen zemin

    //  LOGO 
    let curY=LOGO_PAD;
    if(imgs._logo){
      const pad=16;
      const scaledW=logoW*logoState.scale, scaledH=logoH*logoState.scale;
      const drawX=W/2-scaledW/2+logoState.x;
      const drawY=logoY+logoState.y;
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=16;
      ctx.fillStyle='rgba(255,255,255,0.95)';
      const cardX=drawX-pad, cardY=drawY-pad;
      const cardW=scaledW+pad*2, cardH=scaledH+pad*2;
      if(ctx.roundRect) ctx.roundRect(cardX,cardY,cardW,cardH,14);
      else ctx.rect(cardX,cardY,cardW,cardH);
      ctx.fill(); ctx.restore();
      ctx.drawImage(imgs._logo, drawX, drawY, scaledW, scaledH);
      curY=logoY+logoH+LOGO_PAD*2+20;
    }

    //  GRSELLER  tam genilik, orijinal oran 
    for(let i=0;i<postGorseller.length;i++){
      const im=imgs['g'+i]; if(!im) continue;
      const st=postGorseller[i].state;
      const ih=imgHeights[i];
      // Sadece yatay kaydrma (st.x) ve zoom (st.scale)  boydan tam
      const sw=bW*st.scale;
      const sh=ih*st.scale;
      const ix=PAD+(bW-sw)/2+st.x;
      const iy=curY+(ih-sh)/2;
      ctx.save(); roundClip(ctx,PAD,curY,bW,ih,18);
      ctx.drawImage(im,ix,iy,sw,sh);
      ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(PAD,curY,bW,ih);
      ctx.restore();
      curY+=ih+GAP;
    }

    //  YAZLAR 
    curY+=36;
    ctx.textAlign='center';
    if(baslik){
      ctx.save();ctx.fillStyle=baslikRenk;
      ctx.font=`700 ${baslikSz}px ${postFont}`;
      ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=8;
      wrapText(ctx,baslik,W-80,baslikSz,postFont).forEach(l=>{ctx.fillText(l,W/2,curY);curY+=baslikSz*1.3;});
      ctx.restore(); curY+=10;
    }
    if(body){
      const br=parseInt(bodyRenk.slice(1,3),16);
      const bg2=parseInt(bodyRenk.slice(3,5),16);
      const bb=parseInt(bodyRenk.slice(5,7),16);
      ctx.save();ctx.fillStyle=`rgba(${br},${bg2},${bb},0.87)`;
      ctx.font=`400 ${bodySz}px ${postFont}`;
      wrapText(ctx,body,W-120,bodySz,postFont).forEach(l=>{ctx.fillText(l,W/2,curY);curY+=bodySz*1.5;});
      ctx.restore();
    }
    ctx.font=`500 26px ${postFont}`;
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillText(ay.isim||'\u0130\u015fletmeniz',W/2,H-36);
    const btn=document.getElementById('indir-btn');if(btn)btn.disabled=false;
  }
}


function roundClip(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}
  else{
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }
  ctx.clip();
}

function postIndir(){
  const c=document.getElementById('postCanvas');if(!c)return;
  const a=document.createElement('a');a.download='kampanya.png';a.href=c.toDataURL('image/png');a.click();

async function wpGonder(){
  const data=await load();
  const list=data.filter(m=>secili.has(m.id)&&m.tel);
  const ay=loadAy();
  const sablon=(document.getElementById('wp-msg')||{}).value||'';
  if(!list.length){toast('Telefon numaras\u0131 olan m\u00fc\u015fteri bulunamad\u0131');return;}

  const canvas=document.getElementById('postCanvas');
  const hasDesign=canvas&&(pLogo||postGorseller.length||
    (document.getElementById('wp-baslik')||{}).value||
    (document.getElementById('wp-body')||{}).value);

  function baslatGonderim(){
    document.querySelectorAll('.wp-banner').forEach(b=>b.remove());
    let i=0;
    const toplam=list.length;

    const banner=document.createElement('div');
    banner.className='wp-banner';
    banner.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;background:#111;color:#fff;padding:16px 18px;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.6);font-family:DM Sans,sans-serif;font-size:13px;min-width:280px;border:1px solid #333';
    banner.innerHTML=`
      <div style="font-weight:700;font-size:14px;margin-bottom:4px">\u1f4ac G\u00f6nderim Paneli</div>
      <div id="wp-sayac" style="color:#aaa;font-size:12px;margin-bottom:10px;line-height:1.5">Ba\u015flat\u0131l\u0131yor\u2026</div>
      <div style="background:#1a1a1a;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11px;color:#888;line-height:1.5">
        \u2139\ufe0f Tasar\u0131m indirildi. Her ki\u015fi i\u00e7in WA a\u00e7\u0131l\u0131r \u2014 foto\u011fraf\u0131 manuel ekleyin.
      </div>
      <div style="display:flex;gap:8px">
        <button id="wp-ileri" style="flex:1;background:#25D366;color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif">\u25b6 Sonraki Ki\u015fi</button>
        <button onclick="this.closest('.wp-banner').remove()" style="background:#333;color:#ccc;border:none;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:13px">\u2715</button>
      </div>`;
    document.body.appendChild(banner);

    function gonder(){
      if(i>=toplam){
        document.getElementById('wp-sayac').innerHTML=`<span style="color:#25D366">\u2713 ${toplam} ki\u015fiye g\u00f6nderim tamamland\u0131</span>`;
        document.getElementById('wp-ileri').style.display='none';
        return;
      }
      const m=list[i];
      const tel=m.tel.replace(/\D/g,'');
      const tf=tel.startsWith('0')?'90'+tel.slice(1):tel.startsWith('90')?tel:'90'+tel;
      const isimDeger=m.ad||m.soyad||ay.isim||'Say\u0131n M\u00fc\u015fterimiz';
      const km=sablon
        .replace(/\[\u0130sim\]/g,isimDeger)
        .replace(/\[Soyad\]/g,m.soyad||'')
        .replace(/\[\u0130\u015fletme\]/g,ay.isim||'');

      document.getElementById('wp-sayac').innerHTML=
        `<strong style="color:#fff">${i+1}/${toplam}</strong> \u2014 ${isimDeger}<br><span style="color:#666">${m.tel}</span>`;

      if(navigator.clipboard)navigator.clipboard.writeText(km).catch(()=>{});
      window.open(`https://wa.me/${tf}?text=${encodeURIComponent(km)}`,'_blank');
      i++;
    }

    document.getElementById('wp-ileri').onclick=gonder;
    gonder();
  }

  if(hasDesign){
    canvas.toBlob(blob=>{
      // Bir kez indir
      const a=document.createElement('a');
      a.download='kampanya.png'; a.href=URL.createObjectURL(blob); a.click();
      // Kk bildirim, hemen gnderime ge
      toast('\u1f4e5 Tasar\u0131m indirildi \u2014 g\u00f6nderim paneli a\u00e7\u0131ld\u0131',2500);
      setTimeout(baslatGonderim, 400);
    },'image/png');
  } else {
    baslatGonderim();
  }
}

    <div class="mb">

async function ayLogoYukle(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async e=>{
    const ay=await loadAy();
    ay.logo=e.target.result;
    await saveAy(ay);
    renderStats(); toast('Logo kaydedildi \u2713'); closeModal(); acAyarlar();
  };
  r.readAsDataURL(f);
}

async function ayKaydet(){
  const ay=await loadAy();
  ay.isim=document.getElementById('ay-isim').value;
  ay.r1=document.getElementById('ay-r1').value;
  ay.r2=document.getElementById('ay-r2').value;
  await saveAy(ay);
  renderStats(); closeModal(); toast('Ayarlar kaydedildi \u2713');

async function vExport(){
  const d=await load();
  // CSV olarak da aktar
  const satirlar=[['Ad','Soyad','Telefon','Email','Kategori','Son Ziyaret','Notlar']];
  d.forEach(m=>satirlar.push([m.ad||'',m.soyad||'',m.tel||'',m.mail||'',m.k||'',m.ziyaret||'',m.not||'']));
  const csv=satirlar.map(r=>r.map(c=>'"'+(c+'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='crm_musteri_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('CSV olarak d\u0131\u015fa aktar\u0131ld\u0131 \u2713');
}

//  EXCEL / CSV E AKTARMA 
let _importRows=[], _importHeaders=[];

function vImportAc(inp){
  const f=inp.files[0]; if(!f)return;
  inp.value='';
  const ext=f.name.split('.').pop().toLowerCase();

  if(ext==='csv'){
    const r=new FileReader();
    r.onload=e=>csvParseveGoster(e.target.result);
    r.readAsText(f,'UTF-8');
  } else if(ext==='xlsx'||ext==='xls'){
    // SheetJS CDN'den ykle
    if(!window.XLSX){
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=()=>{ xlsxOku(f); };
      document.head.appendChild(s);
    } else { xlsxOku(f); }
  } else {
    alert('Sadece .xlsx, .xls veya .csv dosyas\u0131 kabul edilir.');
  }
}

function xlsxOku(f){
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(!json.length){alert('Dosya bo\u015f g\u00f6r\u00fcn\u00fcyor.');return;}
    const headers=json[0].map(h=>(h+'').trim());
    const rows=json.slice(1).filter(r=>r.some(c=>c!==''));
    importEslestirmeGoster(headers,rows);
  };
  r.readAsArrayBuffer(f);
}

function csvParseveGoster(text){
  // BOM temizle
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){alert('Dosya bo\u015f.');return;}

  function parseLine(line){
    const res=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){res.push(cur.trim());cur='';}
      else cur+=c;
    }
    res.push(cur.trim());
    return res;
  }

  // Ayrc tespiti: virgl veya noktal virgl
  const delim=lines[0].includes(';')?';':',';
  const parse=delim===','?parseLine:l=>l.split(';').map(c=>c.trim().replace(/^"|"$/g,''));

  const headers=parse(lines[0]);
  const rows=lines.slice(1).map(l=>parse(l)).filter(r=>r.some(c=>c));
  importEslestirmeGoster(headers,rows);
}

function importEslestirmeGoster(headers,rows){
  _importHeaders=headers;
  _importRows=rows;

  const alanlar=[
    {key:'ad',     label:'Ad',          zorunlu:false},
    {key:'soyad',  label:'Soyad',       zorunlu:false},
    {key:'tel',    label:'Telefon',     zorunlu:false},
    {key:'mail',   label:'E-posta',     zorunlu:false},
    {key:'k',      label:'Kategori',    zorunlu:false},
    {key:'ziyaret',label:'Son Ziyaret', zorunlu:false},
    {key:'not',    label:'Notlar',      zorunlu:false},
  ];

  // Otomatik eletirme (balk adna gre tahmin)
  const tahminler={};
  const adMap={ad:['ad','isim','name','first','firstname','m\u00fc\u015fteri ad\u0131'],soyad:['soyad','surname','lastname','soyad\u0131'],tel:['tel','telefon','phone','gsm','cep','mobile','no'],mail:['mail','email','e-posta','eposta'],k:['kategori','category','tip','type'],ziyaret:['ziyaret','visit','tarih','date'],not:['not','notlar','note','notes','a\u00e7\u0131klama']};
  headers.forEach((h,i)=>{
    const hl=h.toLowerCase().replace(/\s/g,'');
    for(const [key,synonyms] of Object.entries(adMap)){
      if(synonyms.some(s=>hl.includes(s))&&!tahminler[key]){tahminler[key]=i;}
    }
  });

  const opts=`<option value="">\u2014 E\u015fle\u015ftirme \u2014</option>`+headers.map((h,i)=>`<option value="${i}">${h}</option>`).join('');

  showModal(`<div class="modal" style="max-width:580px">
    <div class="mh"><span class="mt">\u1f4ca S\u00fctun E\u015fle\u015ftirme \u2014 ${rows.length} sat\u0131r</span><button class="btn btn-icon" onclick="closeModal()">\u00d7</button></div>
    <div class="mb">
      <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:var(--rs);padding:10px 12px;font-size:12px;color:#166534;margin-bottom:14px;line-height:1.6">
        \u2705 <strong>${rows.length} sat\u0131r</strong> okundu. Hangi s\u00fctunun hangi alana kar\u015f\u0131l\u0131k geldi\u011fini e\u015fle\u015ftirin.
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${alanlar.map(a=>`
          <div class="field" style="margin:0">
            <label>${a.label}</label>
            <select id="imp-${a.key}" style="font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--s2);color:var(--text);outline:none;width:100%">
              ${opts}
            </select>
          </div>`).join('')}
      </div>
      <div style="margin-top:12px;background:var(--s2);border-radius:var(--rs);padding:10px;font-size:11px;color:var(--t2)">
        <strong>\u00d6nizleme (ilk 3 sat\u0131r):</strong><br>
        ${rows.slice(0,3).map(r=>'\u2022 '+r.slice(0,5).filter(c=>c).join(' | ')).join('<br>')}
      </div>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">\u0130ptal</button>
      <button class="btn btn-p" onclick="importBaslat()">\u2b06 ${rows.length} M\u00fc\u015fteriyi \u0130\u00e7e Aktar</button>
    </div>
  </div>`);

  // Otomatik tahminleri uygula
  setTimeout(()=>{
    for(const [key,idx] of Object.entries(tahminler)){
      const el=document.getElementById('imp-'+key);
      if(el) el.value=idx;
    }
  },50);
}

async function importBaslat(){
  const alanlar=['ad','soyad','tel','mail','k','ziyaret','not'];
  const eslesme={};
  alanlar.forEach(a=>{
    const el=document.getElementById('imp-'+a);
    if(el&&el.value!=='') eslesme[a]=parseInt(el.value);
  });

  if(!Object.keys(eslesme).length){alert('En az bir s\u00fctun e\u015fle\u015ftirin.');return;}

  const btn=document.querySelector('.mf .btn-p');
  if(btn){btn.textContent='\u0130\u00e7e aktar\u0131l\u0131yor\u2026';btn.disabled=true;}

  let basarili=0, hatali=0;
  const toplu=[];

  for(const row of _importRows){
    const m={firma_id:oturum.firma_id, eklenme:bugun()};
    for(const [alan,idx] of Object.entries(eslesme)){
      const val=(row[idx]||'').toString().trim();
      if(val) m[alan]=val;
    }
    if(!m.ad&&!m.tel){hatali++;continue;}
    toplu.push(m);
  }

  // Toplu insert  50'er gruplar halinde
  const grupBoy=50;
  for(let i=0;i<toplu.length;i+=grupBoy){
    const grup=toplu.slice(i,i+grupBoy);
    try{
      await sbFetch('musteriler',{method:'POST',body:JSON.stringify(grup),prefer:'return=minimal'});
      basarili+=grup.length;
    } catch(e){
      // Tek tek dene
      for(const m of grup){
        try{await sbFetch('musteriler',{method:'POST',body:JSON.stringify(m),prefer:'return=minimal'});basarili++;}
        catch{hatali++;}
      }
    }
  }

  closeModal();
  render();
  toast(`\u2713 ${basarili} m\u00fc\u015fteri i\u00e7e aktar\u0131ld\u0131${hatali?` (${hatali} atland\u0131)`:''}`, 4000);
}

function closeModal(){
  document.getElementById('mroot').innerHTML='';
  pLogo=null; postGorseller=[];
  logoState=yeniState();
  postFont="'DM Sans',Arial";
  postBgTip='gradient';
}
</script>
