name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request to Supabase API
        run: |
          # URL içindeki olası tırnak ve boşlukları temizler
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          CLEAN_URL=$(echo "$RAW_URL" | tr -d '"' | tr -d "'" | xargs)
          
          # URL sonunda / varsa temizler
          CLEAN_URL="${CLEAN_URL%/}"
          
          echo "Sending request to API..."
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
